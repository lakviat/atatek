<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atatek | Dzhunushaliev Family Line</title>
    <meta
      name="description"
      content="A simple ancestry tree for the Dzhunushaliev family line."
    >
    <link rel="stylesheet" href="styles.css?v=20260920-mobile-tree">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Dzhunushaliev Family Line</p>
        <h1>Atatek</h1>
      </div>
      <div class="tree-controls" aria-label="Tree controls">
        <button class="text-button" type="button" id="openReference">
          Reference
        </button>
        <button class="icon-button" type="button" data-action="toggle-compact" aria-label="Toggle compact view">
          C
        </button>
        <button class="icon-button" type="button" data-action="toggle-branches" aria-label="Expand or collapse branches">
          All
        </button>
        <button class="icon-button" type="button" data-action="zoom-out" aria-label="Zoom out">
          -
        </button>
        <button class="icon-button" type="button" data-action="reset" aria-label="Fit tree to view">
          Fit
        </button>
        <button class="icon-button" type="button" data-action="zoom-in" aria-label="Zoom in">
          +
        </button>
      </div>
    </header>

    <main class="tree-shell">
      <section class="tree-viewport" id="treeViewport" aria-label="Family tree">
        <div class="tree-canvas" id="treeCanvas">
          <svg class="tree-lines" id="treeLines" aria-hidden="true"></svg>
          <div class="tree-nodes" id="treeNodes"></div>
        </div>
      </section>
      <section class="mobile-tree-view" aria-label="Mobile family tree">
        <div class="mobile-tree-intro">
          <div>
            <p class="mobile-tree-kicker">Family archive</p>
            <h2>Explore the family line</h2>
            <p>Tap a portrait for details. Open a branch to continue through each generation.</p>
          </div>
          <div class="mobile-tree-stats" aria-label="Family tree summary">
            <span><strong id="mobilePeopleCount">0</strong> people</span>
            <span><strong id="mobileGenerationCount">0</strong> generations</span>
          </div>
        </div>
        <div class="mobile-tree-toolbar">
          <span class="mobile-mode-label">Tree view</span>
          <div class="generation-filter" role="group" aria-label="Generation depth">
            <span>Show</span>
            <button type="button" data-depth="2">2</button>
            <button type="button" data-depth="3">3</button>
            <button type="button" data-depth="4">4</button>
            <button type="button" data-depth="all">All</button>
          </div>
        </div>
        <div class="mobile-tree-list" id="mobileTreeView"></div>
      </section>
    </main>

    <dialog class="profile-dialog" id="profileDialog" aria-labelledby="profileName">
      <button class="close-button" type="button" id="closeProfile" aria-label="Close profile">
        x
      </button>
      <div class="profile-content">
        <div class="profile-photo" id="profilePhoto"></div>
        <div class="profile-details">
          <p class="profile-kicker" id="profileGeneration"></p>
          <h2 id="profileName"></h2>
          <p class="profile-years" id="profileYears"></p>
          <dl class="profile-facts" id="profileFacts"></dl>
          <p class="profile-note" id="profileNote"></p>
        </div>
      </div>
    </dialog>

    <dialog class="reference-dialog" id="referenceDialog" aria-labelledby="referenceTitle">
      <button class="close-button" type="button" id="closeReference" aria-label="Close reference">
        x
      </button>
      <figure>
        <img src="assets/reference/sons-daughters-order.jpg" alt="Marked family group photo showing children numbered 1 through 8">
        <figcaption id="referenceTitle">
          Marked order of grandpa's sons and daughters
        </figcaption>
      </figure>
      <figure>
        <img src="assets/reference/child-06-family-order.jpg" alt="Marked family photo showing number six's children numbered 1 through 4">
        <figcaption>
          Marked order of child 6's children
        </figcaption>
      </figure>
      <figure>
        <img src="assets/reference/couple-tree-design-reference.jpg" alt="Reference family tree design with couples connected by heart icons">
        <figcaption>
          Couple-node design direction
        </figcaption>
      </figure>
    </dialog>

    <script src="app.js?v=20260920-mobile-tree"></script>
  </body>
</html>
